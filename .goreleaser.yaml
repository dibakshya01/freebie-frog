# GoReleaser configuration for freebie-frog.
# Build locally with:   goreleaser release --snapshot --clean
# A tagged push (v*) triggers .github/workflows/release.yml.
version: 2

project_name: freebie-frog

before:
  hooks:
    - go mod tidy

builds:
  - id: freebie
    main: ./cmd/freebie
    binary: freebie
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dibakshya01/freebie-frog/internal/version.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  name_template: "freebie-frog {{ .Version }}"
