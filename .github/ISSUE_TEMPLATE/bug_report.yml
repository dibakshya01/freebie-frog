name: Bug report
description: Report a problem with freebie-frog
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please do **not** paste real API keys, tokens,
        or secret-bearing prompts. Redact anything sensitive.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
      placeholder: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include the exact command and (redacted) config.
      placeholder: |
        1. Configure provider ...
        2. Run `freebie serve`
        3. Run `claude ...`
        4. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: freebie version
      description: Output of `freebie version`
      placeholder: "v0.1.0 or dev (commit)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider / model involved
      placeholder: "e.g. nvidia-nim / deepseek-ai/deepseek-v3"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Run with `FREEBIE_LOG_LEVEL=debug` and paste output. Redact secrets.
      render: shell
