<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="freebie-frog">
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0a0f0c"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#243029" stroke-width="1.5"/>
  <!-- the hop: route from source (green) over the apex to destination (cyan) -->
  <path d="M15 46 C 23 20, 41 20, 49 46" fill="none" stroke="#35e089" stroke-width="4.2" stroke-linecap="round"/>
  <!-- frog eyes at the apex -->
  <circle cx="26.5" cy="24" r="4.1" fill="#35e089"/>
  <circle cx="37.5" cy="24" r="4.1" fill="#35e089"/>
  <circle cx="26.5" cy="24" r="1.5" fill="#0a0f0c"/>
  <circle cx="37.5" cy="24" r="1.5" fill="#0a0f0c"/>
  <!-- source + destination nodes -->
  <circle cx="15" cy="46" r="5.4" fill="#35e089"/>
  <circle cx="49" cy="46" r="5.4" fill="#57bada"/>
</svg>
